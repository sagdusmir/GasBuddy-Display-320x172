substitutions:
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  # You will propably need to do changes only to the following lines (if at all): #
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

  # Name of the ESPHome device (modify if you like, avoid special characters)
  name: gasbuddy-display
  device_description: "Monitor a GasBuddy Scale"
  version: "GasBuddyDisplay 0.0.1"

  # either pull values from secrets.yaml
  # or have it directly in this file
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  # wifi_ssid: "INSERT_YOUR_WIFI_SSID"
  # wifi_password: "INSERT_YOUR_WIFI_PASSWORD"

  # Enter data of the newly created Home Assistant ESPHome device. Example:
  api_encryption_key: "YcM9Kcc+DRDHfISFcF8FlDN0WuanM1LJV3duK/PugZA="

  # over-the-air updates (ESPHome CLI or Home Assistant add-On)
  # Hint: if you changed this value on the device, you might have to alter
  # this value here to match it. esphome cli uses the value from the yaml for the ota update!
  ota_password: "8fdf9f656d36180bfba92d596c9e7db4"

  # color scheme
  SETTINGS_COLOR_SCHEME_IDX: "0"  # initially selected color scheme
  COLOR_SCHEMES: |
    //                  idx 100%      75%       50%       25%       <=25%    GOOD      BAD       LIGHT
    {                        
      {"white",         {0, 0xffffff, 0xdfdfdf, 0xbfbfbf, 0x808080, 0x808080, 0x8bff85, 0xff5757, 0xffff00}},
      {"amber",         {1, 0xffb900, 0xc08b00, 0x805d00, 0x392900, 0x392900, 0x58b100, 0xff5600, 0xffff00}},
      {"cyan",          {2, 0x68e2fb, 0x34acbf, 0x007582, 0x003c43, 0x003c43, 0x75fb8a, 0xea838d, 0xffff00}},
      {"night red",     {3, 0xff0059, 0xe0004f, 0xc00044, 0x80002e, 0x80002e, 0xff0059, 0xe4d300, 0xffff00}},
      {"green",         {4, 0x00ff00, 0x03d600, 0x058d00, 0x046f00, 0x046f00, 0x00ff00, 0xfe3a03, 0xffff00}},
      {"night blue",    {5, 0x1a00ff, 0x1700db, 0x1300b6, 0x0d007a, 0x0d007a, 0x00ff4d, 0xff0092, 0xffff00}},
      {"purple",        {6, 0xff00e4, 0xe000c8, 0xc000ac, 0x800073, 0x800073, 0x00ffb0, 0xff1100, 0xffff00}},
      {"yellow",        {7, 0xffda00, 0xc0a400, 0x806d00, 0x262000, 0x262000, 0x64dc00, 0xff5900, 0xffff00}},
      {"white (clean)", {8, 0xffffff, 0xdfdfdf, 0xbfbfbf, 0x808080, 0x000000, 0x8bff85, 0xff5757, 0xffff00}}
    }

  COLOR_SCHEME_OPTIONS:  # required for Home Assistant
    - "white"
    - "amber"
    - "cyan"
    - "night red"
    - "green"
    - "night blue"
    - "purple"
    - "yellow"
    - "white (clean)"

  FORCE_SHADOW_COLOR_TO_BLACK: 'false'  # standard: use COLOR_00 for shadows
  # FORCE_SHADOW_COLOR_TO_BLACK: 'true'  # alternative: symbol and text shadows should not be visible

  # minimum gas tank level
  SETTINGS_MIN_GAS_VALUE: "15"

  # battery SOC
  SETTINGS_HIDE_SOC: "false"
  SETTINGS_MIN_SOC_VALUE: "25"

  # interval for alarm sound
  Beeper_interval: "5s"

  # sounds (in RTTTL syntax):
  Wifi_Connect_Sound: "dadi:d=16,o=6,b=140:d6,32p,e6"
  Wifi_Disconnect_Sound: "siren:d=8,o=5,b=100:d,e,d,e,d,e,d,e"
  
  # D A N G E R  Z O N E! # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
  # From here on, please only make changes if you know what you are doing and   #
  # have an idea of what you want to achieve. :)                                #
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

  # shades of white (initial start values since substitutions work best)
  COLOR_100:   "0xffffff"  # 100% brightness
  COLOR_75:    "0xbfbfbf"  #  75%
  COLOR_50:    "0x808080"  #  50%
  COLOR_25:    "0x404040"  #  25%
  COLOR_00:    "0x404040"  # shadows
  COLOR_GOOD:  "0x8bff85"
  COLOR_BAD:   "0xff5757"
  COLOR_LIGHT: "0xffff00"

esphome:
  name: ${name}
  build_path: /tmp/esphome_build/${name}
  min_version: "2026.8.2"

  project:
    name: "gasbuddy.display320_172"
    version: ${version}

  on_boot:
    # priority: 1100 # stay above 1000 and below 1500!  # CHANGE FOR MINI
    then:
      - lambda: id(boot_start_time) = millis();
      - light.turn_on: backlight

esp32:
  board: esp32-c6-devkitc-1
  # variant: esp32c6  # use either board: or variant
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # CONFIG_ESP_TASK_WDT_EN: n  # Disables Task Watchdog Timer (TWDT)
      CONFIG_ESP_INT_WDT: "n"      # Disables Interrupt Watchdog Timer (IWDT)
      # COMPILER_OPTIMIZATION_SIZE: "y"  # optimize for size
      CONFIG_COMPILER_OPTIMIZATION_PERF: "y"
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_ESP_WIFI_TASK_CORE_ID: "0"
      CONFIG_BT_BTC_TASK_CORE_ID: "0"
      CONFIG_BT_NIMBLE_PINNED_TO_CORE: "0"
      CONFIG_TCPIP_TASK_CORE_ID: "0"
      CONFIG_ESP_TIMER_TASK_CORE_ID: "0"
      CONFIG_ESP_MAIN_TASK_AFFINITY_CPU1: "y"

# psram:   # CHANGE FOR MINI
#   mode: octal
#   speed: 80MHz

logger:
  baud_rate: 921600  # enable logging
  # baud_rate: 0  # no logging -> saves power

api: # enable Home Assistant API
  max_connections: 5
  encryption:
    key: ${api_encryption_key}
  reboot_timeout: 0s  

http_request:
  # optional global defaults (recommended for reliability)
  timeout: 5s
  verify_ssl: true
  follow_redirects: true

ota:
  - platform: esphome
    id: my_ota
    password: ${ota_password}

wifi:
  id: my_wifi
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  fast_connect: False
  reboot_timeout: 0s
  on_connect:
    then:
      - rtttl.play: ${Wifi_Connect_Sound}
      - lambda: |-
          id(current_ip_address) = id(wifi_ip_sensor).state.c_str();
      - globals.set:
          id: wifi_connected
          value: 'true'
      - globals.set:
          id: apply_wifi_started_by_user
          value: 'false'
      - lvgl.widget.refresh: wifi_connect_label
      - lvgl.widget.refresh: current_wifi_ip_label
  on_disconnect:
    then:
      - rtttl.play: ${Wifi_Disconnect_Sound}
      - globals.set:
          id: wifi_connected
          value: 'false'
      - globals.set:
          id: current_ip_address
          value: '" "'  # not connected
      - lvgl.widget.refresh: wifi_connect_label
      - lvgl.widget.refresh: current_wifi_ip_label

# External Components
external_components:
  - source: github://widget/esphome-components
    components: [axs5106]
    refresh: 0s


i2c: # used for touchscreen
  - id: touchscreen_bus
    sda: GPIO18
    scl: GPIO19
    frequency: 400kHz
    scan: false
  # I2C Bus:
  #   SDA Pin: GPIO18
  #   SCL Pin: GPIO19
  #   Frequency: 400000 Hz
  #   Recovery: bus successfully recovered
  # Results from bus scan:
  # Found device at address 0x63
  # Found device at address 0x6B

# Touchscreen
touchscreen:
  - platform: axs5106
    id: my_touchscreen
    i2c_id: touchscreen_bus
    interrupt_pin: GPIO21
    reset_pin: GPIO20
    calibration:
      x_min: 0
      y_min: 0
      y_max: 172
      x_max: 320
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    # for test purposes, touch coordinates can be logged
    # on_touch:
    #     - lambda: |-
    #         ESP_LOGI("Touch", "Touch detected at x=%d, y=%d", touch.x, touch.y);
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "Display is resuming"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: backlight

spi:  # used for display
  clk_pin: GPIO1
  mosi_pin: GPIO2

display:
  - platform: mipi_spi
    id: my_display
    model: ST7789V
    dc_pin: GPIO15
    cs_pin: GPIO14
    reset_pin: GPIO22
    dimensions:
      width: 320
      height: 172
      offset_height: 34
      offset_width: 0
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    invert_colors: false
    data_rate: 80MHz
    color_order: bgr
    # update_interval: 1s
    
output:
  - platform: ledc
    id: gpio_backlight_pwm
    pin: GPIO23

  - id: helper_low_beeper
    platform: ledc
    pin: GPIO6
  - platform: ledc
    id: rtttl_out
    pin: GPIO5

light:
  - id: backlight
    name: Backlight
    platform: monochromatic
    output: gpio_backlight_pwm
    restore_mode: ALWAYS_ON
    internal: true

rtttl:
  id: my_rtttl
  output: rtttl_out
  gain: 80%

interval:
  - interval: 10s
    then:
      - lvgl.widget.refresh: warning_on_label
  # - interval: ${Beeper_interval}
  #   then:
  #     - lambda: |-
  #         if( ((id(zone1_limit_value) > 0) && (id(zone1_value) >= id(zone1_limit_value)))
  #         ) {
  #           id(my_rtttl).play("${Zone_Limit_Alarm_Sound}");
  #         }
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - lambda: return !id(boot_screen_color_scheme_init);
          then:
            - lambda: |-
                id(boot_screen_color_scheme_init) = true;
                id(apply_color_scheme).execute();

      - if:
          condition:
            and:
              - lambda: 'return !id(boot_screen_hidden);'
              - lambda: 'return millis() - id(boot_start_time) >= 2000;'
          then:
            - script.execute: hide_boot_screen

globals:
  - id: wifi_connected
    type: bool
    initial_value: 'false'
  - id: warning_on
    type: bool
    initial_value: 'false'
  - id: gas_weight
    type: int32_t
    initial_value: '-1'
  - id: gas_percent
    type: int32_t
    initial_value: '0'
  - id: apply_wifi_started_by_user  # for supressing sounds
    type: bool
    initial_value: 'false'

  - id: color_schemes
    type: std::map<std::string, std::vector<uint32_t>>
    initial_value: '${COLOR_SCHEMES}'
  - id: color_100
    type: int
    initial_value: '0x000000'
  - id: color_75
    type: int
    initial_value: '0x000000'
  - id: color_50
    type: int
    initial_value: '0x000000'
  - id: color_25
    type: int
    initial_value: '0x000000'
  - id: color_00
    type: int
    initial_value: '0x000000'
  - id: color_good
    type: int
    initial_value: '0x000000'
  - id: color_bad
    type: int
    initial_value: '0x000000'
  - id: color_light
    type: int
    initial_value: '0x000000'

  - id: boot_start_time
    type: uint32_t
    initial_value: '0'
  - id: boot_screen_hidden
    type: bool
    initial_value: 'false'
  - id: boot_screen_color_scheme_init
    type: bool
    initial_value: 'false'

  - id: battery_soc_value
    type: int
    initial_value: '0'

  - id: settings_min_gas_value_persistent
    type: int
    initial_value: '${SETTINGS_MIN_GAS_VALUE}'
    restore_value: true
  - id: settings_min_soc_value_persistent
    type: int
    initial_value: '${SETTINGS_MIN_SOC_VALUE}'
    restore_value: true
  - id: settings_hide_soc_persistent
    type: bool
    initial_value: '${SETTINGS_HIDE_SOC}'
    restore_value: true
  - id: settings_display_timeout_value_persistent
    type: int
    initial_value: '30'
    restore_value: true
  - id: settings_color_scheme_idx_persistent
    type: int
    initial_value: '${SETTINGS_COLOR_SCHEME_IDX}'
    restore_value: true

  - id: current_ip_address
    type: std::string
    initial_value: '" "'  # not connected

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip_sensor

  - platform: template
    name: "Software Version"
    lambda: |-
      return std::string("${version}");

select:
  - platform: template
    id: color_scheme_select
    name: "Color Scheme"
    optimistic: true
    options: ${COLOR_SCHEME_OPTIONS}
    on_value:
      - lambda: |-
          for (const auto& pair : id(color_schemes)) {
            if (pair.first == x) {
              id(settings_color_scheme_idx_persistent) = static_cast<int>(pair.second[0]);
              id(apply_color_scheme).execute();
              break;
            }
          }

switch:
  - platform: template
    name: "Hide Battery SOC"
    id: hide_soc_switch
    optimistic: true
    on_turn_on:
      - lambda: id(settings_hide_soc_persistent) = true;
      - lvgl.widget.refresh: battery_symbol_obj
    on_turn_off:
      - lambda: id(settings_hide_soc_persistent) = false;
      - lvgl.widget.refresh: battery_symbol_obj

number:
  - platform: template
    name: "Min Gas Value"
    id: min_gas_value_number
    optimistic: true
    min_value: 5
    max_value: 60
    step: 5
    unit_of_measurement: "%"
    initial_value: 20.0
    on_value:
      - lambda: id(settings_min_gas_value_persistent) = int(x);
      - lvgl.widget.refresh: [warning_on_label, gas_percent_bar, gas_warning_label2]

  - platform: template
    name: "Min Battery SOC Value"
    id: min_soc_value_number
    optimistic: true
    min_value: 5
    max_value: 50
    step: 10
    unit_of_measurement: "%"
    initial_value: 40.0
    on_value:
      - lambda: id(settings_min_soc_value_persistent) = int(x);
      - lvgl.widget.refresh: [warning_on_label, battery_symbol, soc_warning_label2]

