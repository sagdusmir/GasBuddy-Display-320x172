              }
              return id(gas_rate_g_per_h) < ${GAS_RATE_STABLE_LIMIT};
            text: "h"
        - label:
            id: weight_time_icon
            align: TOP_LEFT
            x: 286
            y: 147
            width: 22
            bg_color: 0x000000
            bg_opa: COVER
            pad_all: 0
