            checked:
              bg_opa: COVER
              bg_color: !lambda return lv_color_hex(id(color_50));
              border_color: !lambda return lv_color_hex(id(color_50));
            widgets:
              - label:
                  id: calibration_bottle_kg_button_1_label
                  align: CENTER
                  width: 92
                  text_font: MONTSERRAT_20
                  text_align: CENTER
                  bg_opa: TRANSP
                  text_color: !lambda |-
                    if (id(settings_scale_bottle_kg) == id(scale_bottle_kg_options)[1]) {
                      return lv_color_hex(id(color_100));
                    }
                    return lv_color_hex(id(color_75));
