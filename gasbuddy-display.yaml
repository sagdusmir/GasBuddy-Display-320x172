lvgl:
  buffer_size: 50%
  displays: my_display
  touchscreens: my_touchscreen
  bg_color: 0
  border_width: 0
  outline_width: 0
  theme:
    label:
      bg_color: 0
      bg_opa: COVER
      width: 120
      text_align: CENTER
    bar:
      radius: 5
      indicator:
        radius: 5
        arc_color: red
    arc:
      radius: 5
      indicator:
        arc_rounded: false
        radius: 5
    roller:
      text_font: MONTSERRAT_20
      width: 60
      selected:
        text_font: MONTSERRAT_BOLD_FONT_18
    button:
      border_width: 0
      radius: 0
    slider:
      bg_opa: COVER
      radius: 0
      adv_hittest: true
      border_width: 0
      indicator:
        radius: 0
      knob:
        radius: 2

    textarea:
      width: 340
      height: 30
      text_font: MONTSERRAT_18
      border_width: 1
    keyboard:
      text_color: ${COLOR_100}
      bg_color: ${COLOR_25}
      items:
        bg_color: ${COLOR_100}
        text_color: ${COLOR_25}

  # send display to idle state after timeout
  on_idle:
    timeout: !lambda "return(id(settings_display_timeout_value_persistent) * 1000);"
    then:
    - if:
        condition:
          - lambda: "return id(settings_display_timeout_value_persistent) > 0;"
        then:
          - logger.log: "Display is idle"
          - light.turn_off: backlight
          - lvgl.pause:

  # boot screen with spinner - just for fun
  top_layer:
    widgets:
      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 320
          height: 172
          bg_color: 0
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - spinner:
                id: boot_spinner
                align: CENTER
                spin_time: 1s
                arc_length: 60deg
                arc_width: 4
                arc_color: 0
                indicator:
                  arc_color: 0  # overridden after color scheme is known
                  arc_width: 4

      - obj:
          id: status_bar_top
          x: 0
          y: 0
          width: 320
          height: 30
          bg_color: 0
          bg_opa: COVER
          pad_all: 0
          border_width: 0
          hidden: true
          radius: 0
          widgets:            
            - obj: # horizontal battery icon
                id: battery_symbol_obj
                x: 287
                y: 0
                width: 30
                height: 27
                bg_color: 0
                pad_all: 0
                outline_width: 0
                border_width: 0
                border_side: NONE
                radius: 0
                hidden: !lambda |-
                  return id(settings_hide_soc_persistent);
                widgets:
                  - label:
                      id: battery_symbol
                      x: 0
                      y: 0
                      text_font: MONTSERRAT_24
                      text_align: LEFT
                      width: 30
                      text_color: !lambda |-
                        if( id(battery_soc_value) <= id(settings_min_soc_value_persistent) ) {
                          return lv_color_hex(id(color_bad));
                        }
                        return lv_color_hex(id(color_good));
                      text: !lambda |-
                        const char* icons[5] = {"\U0000F244","\U0000F243","\U0000F242","\U0000F241","\U0000F240"};
                        float soc = id(battery_soc_value);
                        int idx = soc <= 15 ? 0 :
                            soc <= 40 ? 1 :
                            soc <= 60 ? 2 :
                            soc <= 80 ? 3 : 4;
                        return icons[idx];
            - label: # symbol for successfull WIFI connection
                id: wifi_connect_label
                x: 255
                y: 1
                text_font: MONTSERRAT_20
                text_align: LEFT
                width: 26
                text_color: !lambda |-
                  if( id(wifi_connected) ) {
                    return lv_color_hex(id(color_good));
                  }
                  return lv_color_hex(id(color_00));
                text: "\uF1EB" # WIFI symbol
            - label:
                id: warning_on_label
                x: 228
                y: 2
                text_font: MONTSERRAT_20
                text_color: !lambda |-
                  if (millis() - id(boot_start_time) < 15000) {
                    // first 15 seconds after boot: no warning
                    return lv_color_hex(id(color_00));
                  }
                  if((id(battery_soc_value) <= id(settings_min_soc_value_persistent))
                    || id(warning_on)
                    || (id(gas_percent) <= id(settings_min_gas_value_persistent))
                  ) {
                    return lv_color_hex(id(color_bad));
                  }
                  return lv_color_hex(id(color_00));
                text_align: LEFT
                width: 24
                text: "\uF071"
            - label: # catch clicks
                x: 0
                y: 0
                width: 320
                height: 30
                bg_opa: TRANSP
                pad_all: 0
                border_width: 0
                radius: 0
                clickable: true
                text: " "
                on_press:
                  - script.execute: toggle_settings_page

  pages:
    - id: scale_page
      bg_color: 0x000000
      bg_opa: COVER
      pad_all: 0
      scrollable: false
      widgets:
        - label:
            id: weight_label_background
            align: TOP_LEFT
            x: 0
            y: 34
            width: 265
            bg_color: 0x000000
            bg_opa: COVER
            pad_all: 0
            border_width: 0
            text_font: SEGMENT_FONT_65
            text_align: RIGHT
            text_color: !lambda return lv_color_hex(id(color_25));
            text: "18888"
        - label:
            id: weight_label
            align: TOP_LEFT
            x: 0
            y: 34
            width: 265
            bg_opa: TRANSP
            pad_all: 0
            border_width: 0
            text_font: SEGMENT_FONT_65
            text_align: RIGHT
            text_color: !lambda return lv_color_hex(id(color_100));
            text: !lambda |-
              int v = id(gas_weight);
              if (v < 0) {
                return "---";
              }
              return to_string(v).c_str();
        - label:
            id: weight_unit
            align: TOP_LEFT
            x: 277
            y: 73
            width: 29
            bg_color: 0x000000
            bg_opa: COVER
            pad_all: 0
            border_width: 0
            text_font: ICON_FONT_29
            text_align: RIGHT
            text_color: !lambda return lv_color_hex(id(color_100));
            text: "\U000F0D3F"
        - obj:
            id: gas_level_obj
            x: 14
            y: 111
            width: 292
            height: 18
            pad_all: 0
            scrollable: false
            overflow_visible: true
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            hidden: !lambda |-
              return false;
            widgets:
              # Old frame fill. The warning mark is drawn after this, so its
              # lips stay visible, and the bar and dividers cover the middle.
              - obj:
                  x: 0
                  y: 2
                  width: 292
                  height: 14
                  bg_color: 0x000000
                  bg_opa: COVER
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  scrollable: false
                  clickable: false
              - obj:
                  id: gas_warning_mark
                  x: -2
                  y: 0
                  height: 18
                  width: !lambda |-
                    int level = id(settings_min_gas_value_persistent);
                    if (level < 0) {
                      level = 0;
                    }
                    if (level > 100) {
                      level = 100;
                    }
                    return level * 290 / 100 + 3;
                  hidden: !lambda |-
                    return id(settings_min_gas_value_persistent) <= 0;
                  bg_opa: COVER
                  bg_color: !lambda return lv_color_hex(id(color_100));
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  scrollable: false
              - bar:
                  id: gas_percent_bar
                  x: 1
                  y: 4
                  height: 10
                  width: 290
                  radius: 0
                  min_value: 1
                  max_value: 100
                  bg_opa: COVER
                  bg_color: !lambda return lv_color_hex(id(color_25));
                  indicator:
                    radius: 0
                    bg_color: !lambda return lv_color_hex(id(color_100)); // placeholder
                  value: !lambda |-
                    int y = id(gas_weight);
                    if( y < 0) {
                      return 0;
                    }
                    int z = id(gas_percent);
                    if (z < 0) {
                      z = 0;
                    }
                    if (z > 100) {
                      z = 100;
                    }
                    if( z <= id(settings_min_gas_value_persistent) ) {
                      lv_obj_set_style_bg_color(id(gas_percent_bar), lv_color_hex(id(color_bad)), LV_PART_INDICATOR);
                    } else {
                      lv_obj_set_style_bg_color(id(gas_percent_bar), lv_color_hex(id(color_good)), LV_PART_INDICATOR);
                    }
                    return z;
              # 2px border on every side. The first nine boxes are 2px wider
              # than the step, so neighboring borders share those pixels and
              # each vertical divider stays 2px. The boxes sit 2px below the
              # top of gas_level_obj so the warning mark shows above and below.
              - label:  # 1/10
                  x: 1
                  y: 2
                  width: 31
                  height: 14
                  bg_opa: TRANSP
                  border_width: 2
                  radius: 0
                  border_color: 0
                  text: " "
              - label:  # 2/10
                  x: 30
                  y: 2
                  width: 31
                  height: 14
                  bg_opa: TRANSP
                  border_width: 2
                  radius: 0
                  border_color: 0
                  text: " "
              - label:  # 3/10
                  x: 59
                  y: 2
                  width: 31
                  height: 14
                  bg_opa: TRANSP
                  border_width: 2
                  radius: 0
                  border_color: 0
                  text: " "
              - label:  # 4/10
                  x: 88
                  y: 2
                  width: 31
                  height: 14
                  bg_opa: TRANSP
                  border_width: 2
                  radius: 0
                  border_color: 0
                  text: " "
              - label:  # 5/10
                  x: 117
                  y: 2
                  width: 31
                  height: 14
                  bg_opa: TRANSP
                  border_width: 2
                  radius: 0
                  border_color: 0
                  text: " "
              - label:  # 6/10
                  x: 146
                  y: 2
                  width: 31
                  height: 14
                  bg_opa: TRANSP
                  border_width: 2
                  radius: 0
                  border_color: 0
                  text: " "
              - label:  # 7/10
                  x: 175
                  y: 2
                  width: 31
                  height: 14
                  bg_opa: TRANSP
                  border_width: 2
                  radius: 0
                  border_color: 0
                  text: " "
              - label:  # 8/10
                  x: 204
                  y: 2
                  width: 31
                  height: 14
                  bg_opa: TRANSP
                  border_width: 2
                  radius: 0
                  border_color: 0
                  text: " "
              - label:  # 9/10
                  x: 233
                  y: 2
                  width: 31
                  height: 14
                  bg_opa: TRANSP
                  border_width: 2
                  radius: 0
                  border_color: 0
                  text: " "
              - label:  # 10/10
                  x: 262
                  y: 2
                  width: 29
                  height: 14
                  bg_opa: TRANSP
                  border_width: 2
                  radius: 0
                  border_color: 0
                  text: " "
        # Fire icon, ghost "1888", live g/h, then Montserrat "g/h".
        # The value is right-aligned so unused leading ghost digits stay visible.
        - label:
            id: weight_rate_icon
            align: TOP_LEFT
            x: 12
            y: 147
            width: 22
            bg_color: 0x000000
            bg_opa: COVER
            pad_all: 0
            border_width: 0
            text_font: ICON_FONT_22
            text_align: LEFT
            text_color: !lambda return lv_color_hex(id(color_100));
            hidden: !lambda |-
              if (!id(gas_rate_known)) {
                return true;
              }
              return id(gas_rate_g_per_h) < ${GAS_RATE_STABLE_LIMIT};
            text: "\U000F0238"
        - label:
            id: weight_rate_background
            align: TOP_LEFT
            x: 23
            y: 144
            width: 80
            bg_color: 0x000000
            bg_opa: TRANSP
            pad_all: 0
            border_width: 0
            text_font: SEGMENT_FONT_24
            text_align: RIGHT
            text_color: !lambda return lv_color_hex(id(color_25));
            hidden: !lambda |-
              if (!id(gas_rate_known)) {
                return true;
              }
              return id(gas_rate_g_per_h) < ${GAS_RATE_STABLE_LIMIT};
            text: "1888"
        - label:
            id: weight_rate_value
            align: TOP_LEFT
            x: 23
            y: 144
            width: 80
            bg_opa: TRANSP
            pad_all: 0
            border_width: 0
            text_font: SEGMENT_FONT_24
            text_align: RIGHT
            text_color: !lambda return lv_color_hex(id(color_100));
            hidden: !lambda |-
              if (!id(gas_rate_known)) {
                return true;
              }
              return id(gas_rate_g_per_h) < ${GAS_RATE_STABLE_LIMIT};
            text: !lambda |-
              if (!id(gas_rate_known) || id(gas_rate_g_per_h) < ${GAS_RATE_STABLE_LIMIT}) {
                return "";
              }
              int grams = (int) (id(gas_rate_g_per_h) + 0.5f);
              if (grams < 0) {
                grams = 0;
              }
              if (grams > 9999) {
                grams = 9999;
              }
              static char buf[8];
              snprintf(buf, sizeof(buf), "%d", grams);
              return buf;
        - label:
            id: weight_rate_unit
            align: TOP_LEFT
            x: 105
            y: 151
            width: 40
            bg_color: 0x000000
            bg_opa: COVER
            pad_all: 0
            border_width: 0
            text_font: MONTSERRAT_18
            text_align: LEFT
            text_color: !lambda return lv_color_hex(id(color_100));
            hidden: !lambda |-
              if (!id(gas_rate_known)) {
                return true;
              }
              return id(gas_rate_g_per_h) < ${GAS_RATE_STABLE_LIMIT};
            text: "g/h"
        # Ghost "88.8", live hours on top, then "h" and the empty hourglass.
        # The decimal is zero-width, and both labels are right-aligned, so
        # "6.0" leaves the leading ghost 8 visible. Do not zero-pad.
        # Hidden until a rate exists, and while that rate is below
        # GAS_RATE_STABLE_LIMIT. Otherwise the hours or "--.-" are shown.
        - label:
            id: weight_time_background
            align: TOP_LEFT
            x: 204
            y: 144
            width: 62
            bg_color: 0x000000
            bg_opa: COVER
            pad_all: 0
            border_width: 0
            text_font: SEGMENT_FONT_24
            text_align: RIGHT
            text_color: !lambda return lv_color_hex(id(color_25));
            hidden: !lambda |-
              if (!id(gas_rate_known)) {
                return true;
              }
              return id(gas_rate_g_per_h) < ${GAS_RATE_STABLE_LIMIT};
            text: "88.8"
        - label:
            id: weight_time_value
            align: TOP_LEFT
            x: 204
            y: 144
            width: 62
            bg_opa: TRANSP
            pad_all: 0
            border_width: 0
            text_font: SEGMENT_FONT_24
            text_align: RIGHT
            text_color: !lambda return lv_color_hex(id(color_100));
            hidden: !lambda |-
              if (!id(gas_rate_known)) {
                return true;
              }
              return id(gas_rate_g_per_h) < ${GAS_RATE_STABLE_LIMIT};
            text: !lambda |-
              if (!id(gas_time_known)) {
                return "--.-";
              }
              float h = id(gas_time_h);
              if (!(h >= 0.0f)) {
                return "--.-";
              }
              if (h > 99.9f) {
                h = 99.9f;
              }
              static char buf[8];
              snprintf(buf, sizeof(buf), "%.1f", (double) h);
              return buf;
        - label:
            id: weight_time_unit
            align: TOP_LEFT
            x: 268
            y: 151
            width: 16
            bg_color: 0x000000
            bg_opa: COVER
            pad_all: 0
            border_width: 0
            text_font: MONTSERRAT_18
            text_align: LEFT
            text_color: !lambda return lv_color_hex(id(color_100));
            hidden: !lambda |-
