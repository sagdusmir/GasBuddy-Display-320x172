sensor:
  - platform: adc
    pin: GPIO0
    name: "Battery SOC"
    unit_of_measurement: "%"
    state_class: measurement
    device_class: battery
    accuracy_decimals: 0
    attenuation: 12db
    samples: 16                # samples taken per update interval
    filters:
      - multiply: 3.0          # due to external voltage divider on adc input
      - sliding_window_moving_average:
          window_size: 15      # average over 15 values
      - calibrate_linear:      # linearise voltage->SOC dependency
          method: exact
          datapoints:
            - 3.00 ->   0.0    # <=3.00V = battery empty (0.0%)
            - 3.36 ->   5.0
            - 3.41 ->  10.0
            - 3.48 ->  20.0
            - 3.52 ->  30.0
            - 3.56 ->  40.0
            - 3.61 ->  50.0
            - 3.70 ->  60.0
            - 3.79 ->  70.0
            - 3.89 ->  80.0
            - 4.00 ->  90.0
            - 4.05 -> 100.0    # >=4.05V = battery full (100.0%)
      - clamp:
          min_value: 0.0
          max_value: 100.0
    update_interval: 4s        # new value after 4s*15(=window size) = 60s!
    on_value:
      - lambda: |-
          id(battery_soc_value) = x;
          id(battery_soc_seen) = true;
      - lvgl.widget.refresh: battery_symbol

  - platform: wifi_signal
    name: "WiFi Signal Strength ESP32"
    update_interval: 10s
  - platform: internal_temperature
    name: "CPU Temperature ESP32"
    update_interval: 10s
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  - platform: template
    name: "Gasbuddy level in g"
    id: gasbuddy_gas_weight
    device_class: weight
    state_class: measurement
    unit_of_measurement: g
    accuracy_decimals: 0
    icon: "mdi:weight-gram"
    on_value:
      - globals.set:
          id: gas_weight
          value: !lambda |-
            if (x >= 11000) {
              return 11000;
            }
            return int(x);
      - lvgl.widget.refresh: [uart_raw_value, weight_label]

  - platform: template
    name: "Gasbuddy level in %"
    id: gasbuddy_gas_percent
    state_class: measurement
    unit_of_measurement: "%"
    icon: "mdi:gas-cylinder"
    update_interval: never
    lambda: |-
      return id(gas_percent);
    on_value:
      - globals.set:
          id: gas_percent
          value: !lambda |-
            int percent = int(x);
            if (percent < 0) {
              return 0;
            }
            if (percent > 100) {
              return 100;
            }
            return percent;
      - lambda: id(gas_percent_seen) = true;
      - lvgl.widget.refresh: [gas_percent_bar, uart_raw_value, warning_on_label]

  - platform: template
    name: "Gasbuddy consumption"
    id: gasbuddy_gas_consumption
    state_class: measurement
    unit_of_measurement: "g/h"
    accuracy_decimals: 1
    icon: "mdi:fire"
    update_interval: never

  - platform: template
    name: "Gasbuddy time left"
    id: gasbuddy_time_left
    device_class: duration
    state_class: measurement
    unit_of_measurement: h
    accuracy_decimals: 1
    icon: "mdi:timer-outline"
    update_interval: never

binary_sensor:
  - platform: status
    name: "Status ESP"

script:
  # Remaining gas from the last saved calibration. UART readings are raw
  # counts, not grams. Zero is the empty platform, brutto is the full bottle.
  # The known empty-bottle and fill masses only mark where 0% sits in that span.
  - id: update_remaining_gas
    then:
      - lambda: |-
          if (!${DEMO_MODE} && id(uart_gas_value) < 0) {
            return;
          }
          int64_t zero = id(settings_scale_raw_zero_persistent);
          int64_t brutto = id(settings_scale_brutto_persistent);
          int64_t raw = id(uart_gas_value);
          int64_t empty_h = id(calibration2_hundredths_persisted);
          int64_t fill_h = (int64_t) id(settings_scale_bottle_kg_persistent) * 100;
          // Exact remaining grams while DEMO_MODE is on. The usage slope and
          // the gram readout both follow this. The percent bar still steps
          // in whole percents.
          double demo_g = 0;
          if (${DEMO_MODE}) {
            // Same formula as below. Only the inputs are synthetic: a saved
            // calibration is used when it has a span, otherwise a stand-in
            // span. Remaining gas starts at 90% and only decreases.
            if (empty_h <= 0) {
              empty_h = 1000;
            }
            if (fill_h <= 0) {
              fill_h = 1100;
            }
            if (brutto <= zero) {
              zero = 10000;
              brutto = 30000;
            }
            const int64_t full_h_demo = empty_h + fill_h;
            const int64_t span_demo = brutto - zero;
            const int64_t empty_count_demo = zero + span_demo * empty_h / full_h_demo;
            const int64_t gas_span_demo = brutto - empty_count_demo;
            const double fill_g = (double) fill_h * 10.0;
            // Piecewise random burn. A new rate is drawn every 30–75 s from
            // 0 .. 4× DEMO_GRAMS_PER_HOUR, and each poll nudges it. The g/h
            // estimate is a ~30 s slope, so the hold is long enough for that
            // label to settle and then move again.
            static double demo_grams = -1.0;
            static double demo_rate_g_h = 0.0;
            static uint32_t demo_last_ms = 0;
            static uint32_t demo_hold_until = 0;
            static uint32_t demo_rng = 0;
            const uint32_t now_ms = millis();
            const double rate_max = (double) ${DEMO_GRAMS_PER_HOUR} * 4.0;
            if (demo_grams < 0.0 || demo_rng == 0) {
              demo_rng = now_ms | 1u;
              demo_grams = fill_g * 0.90;
              demo_last_ms = now_ms;
              demo_hold_until = now_ms;
            }
            const uint32_t dt_ms = now_ms - demo_last_ms;
            demo_last_ms = now_ms;
            demo_grams -= demo_rate_g_h * ((double) dt_ms / 3600000.0);
            if ((int32_t) (now_ms - demo_hold_until) >= 0) {
              demo_rng = demo_rng * 1664525u + 1013904223u;
              demo_rate_g_h = rate_max * (double) (demo_rng % 1000u) / 999.0;
              demo_rng = demo_rng * 1664525u + 1013904223u;
              const uint32_t hold_ms = 30000u + (demo_rng % 45000u);
              demo_hold_until = now_ms + hold_ms;
              ESP_LOGI("uart_gasbuddy", "Demo consumption %.0f g/h for %u s", demo_rate_g_h, (unsigned) (hold_ms / 1000u));
            } else {
              demo_rng = demo_rng * 1664525u + 1013904223u;
              demo_rate_g_h += (double) ((int) (demo_rng % 401u) - 200);
              if (demo_rate_g_h < 0.0) {
                demo_rate_g_h = 0.0;
              }
              if (demo_rate_g_h > rate_max) {
                demo_rate_g_h = rate_max;
              }
            }
            if (demo_grams < 0.0) {
              demo_grams = fill_g * 0.90;
            }
            if (demo_grams > fill_g) {
              demo_grams = fill_g;
            }
            demo_g = demo_grams;
            const double demo_percent = (fill_g > 0.0) ? (demo_g * 100.0 / fill_g) : 0.0;
            if (gas_span_demo > 0) {
              raw = empty_count_demo + (int64_t) (gas_span_demo * demo_percent / 100.0 + 0.5);
            }
          }
          const int64_t span = brutto - zero;
          const int64_t full_h = empty_h + fill_h;
          if (span <= 0 || fill_h <= 0 || full_h <= 0) {
            ESP_LOGI("uart_gasbuddy", "Calculated: no span (raw %d zero %d brutto %d)", (int) raw, (int) zero, (int) brutto);
            id(gas_time_known) = false;
            id(gasbuddy_time_left).publish_state(NAN);
            return;
          }
          const int64_t empty_count = zero + span * empty_h / full_h;
          const int64_t gas_span = brutto - empty_count;
          if (gas_span <= 0) {
            ESP_LOGI("uart_gasbuddy", "Calculated: no gas span (raw %d zero %d brutto %d)", (int) raw, (int) zero, (int) brutto);
            id(gas_time_known) = false;
            id(gasbuddy_time_left).publish_state(NAN);
            return;
          }
          int64_t gas_count = raw - empty_count;
          if (gas_count < 0) {
            gas_count = 0;
          }
          if (gas_count > gas_span) {
            gas_count = gas_span;
          }
          int percent = (int) (gas_count * 100 / gas_span);
          if (percent < 0) {
            percent = 0;
          }
          if (percent > 100) {
            percent = 100;
          }
          int gas_g = (int) (fill_h * 10 * percent / 100);
          if (${DEMO_MODE}) {
            gas_g = (int) (demo_g + 0.5);
            if (gas_g < 0) {
              gas_g = 0;
            }
          }
          ESP_LOGI("uart_gasbuddy", "Calculated: %d %% (%d g) raw %d zero %d brutto %d empty-count %d%s", percent, gas_g, (int) raw, (int) zero, (int) brutto, (int) empty_count, ${DEMO_MODE} ? " demo" : "");
          id(gasbuddy_gas_weight).publish_state(gas_g);
          id(gasbuddy_gas_percent).publish_state(percent);

          // g/h from a least-squares slope over the last GAS_RATE_SAMPLES
          // remaining-gas readings. Positive means the bottle is getting lighter.
          constexpr int kRateN = ${GAS_RATE_SAMPLES};
          static double hist_g[kRateN];
          static uint32_t hist_ms[kRateN];
          static int hist_count = 0;
          static int hist_next = 0;
          static int hist_epoch = 0;
          if (id(gas_rate_epoch) != hist_epoch) {
            hist_count = 0;
            hist_next = 0;
            hist_epoch = id(gas_rate_epoch);
          }
          if (kRateN >= 2) {
            const uint32_t now_ms = millis();
            const double sample_g = ${DEMO_MODE} ? demo_g : (double) gas_g;
            hist_g[hist_next] = sample_g;
            hist_ms[hist_next] = now_ms;
            hist_next = (hist_next + 1) % kRateN;
            if (hist_count < kRateN) {
              hist_count++;
            }
            if (hist_count < kRateN) {
              ESP_LOGI("uart_gasbuddy", "Consumption: waiting %d/%d", hist_count, kRateN);
            } else {
              const int oldest = hist_next;
              const uint32_t t0 = hist_ms[oldest];
              double sum_t = 0;
              double sum_g = 0;
              for (int i = 0; i < kRateN; i++) {
                const int idx = (oldest + i) % kRateN;
                sum_t += (double) (hist_ms[idx] - t0);
                sum_g += (double) hist_g[idx];
              }
              const double mean_t = sum_t / kRateN;
              const double mean_g = sum_g / kRateN;
              double num = 0;
              double den = 0;
              for (int i = 0; i < kRateN; i++) {
                const int idx = (oldest + i) % kRateN;
                const double dt = (double) (hist_ms[idx] - t0) - mean_t;
                const double dg = (double) hist_g[idx] - mean_g;
                num += dt * dg;
                den += dt * dt;
              }
              if (den > 0) {
                double g_per_h = -(num / den) * 3600000.0;
                if (g_per_h < 0 || !std::isfinite(g_per_h)) {
                  g_per_h = 0;
                }
                ESP_LOGI("uart_gasbuddy", "Consumption: %.1f g/h over %d readings", g_per_h, kRateN);
                id(gas_rate_g_per_h) = g_per_h;
                id(gas_rate_known) = true;
                id(gasbuddy_gas_consumption).publish_state(g_per_h);
                const double remain_g = ${DEMO_MODE} ? demo_g : (double) gas_g;
                if (!(g_per_h >= ${GAS_RATE_STABLE_LIMIT}) || !(remain_g >= 0) || !std::isfinite(remain_g)) {
                  id(gas_time_known) = false;
                  id(gasbuddy_time_left).publish_state(NAN);
                } else {
                  float hours = (float) (remain_g / g_per_h);
                  if (!(hours >= 0.0f) || !std::isfinite(hours)) {
                    id(gas_time_known) = false;
                    id(gasbuddy_time_left).publish_state(NAN);
                  } else {
                    if (hours > 99.9f) {
                      hours = 99.9f;
                    }
                    id(gas_time_h) = hours;
                    id(gas_time_known) = true;
                    id(gasbuddy_time_left).publish_state(hours);
                  }
                }
              } else {
                id(gas_time_known) = false;
                id(gasbuddy_time_left).publish_state(NAN);
              }
            }
          }
      - lvgl.widget.refresh:
          - weight_rate_icon
          - weight_rate_background
          - weight_rate_value
          - weight_rate_unit
          - weight_time_background
          - weight_time_value
          - weight_time_unit
          - weight_time_icon

  - id: reset_gas_consumption
    then:
      - lambda: |-
          id(gas_rate_epoch)++;
          id(gas_rate_known) = false;
          id(gas_time_known) = false;
          id(gasbuddy_gas_consumption).publish_state(NAN);
          id(gasbuddy_time_left).publish_state(NAN);
          ESP_LOGI("uart_gasbuddy", "Consumption: reset");
      - lvgl.widget.refresh:
          - weight_rate_icon
          - weight_rate_background
          - weight_rate_value
          - weight_rate_unit
          - weight_time_background
          - weight_time_value
          - weight_time_unit
          - weight_time_icon

  - id: hide_boot_screen
    then:
      - if:
          condition:
            lambda: 'return !id(boot_screen_hidden);'
          then:
            - lambda: |-
                id(apply_color_scheme).execute();
            - lvgl.widget.hide: boot_screen
            - lvgl.widget.show: [status_bar_top]
            - lambda: |-
                int idx = id(settings_color_scheme_idx_persistent);
                std::string name = "white";
                for (const auto& pair : id(color_schemes)) {
                  if (static_cast<int>(pair.second[0]) == idx) {
                    name = pair.first;
                    break;
                  }
                }
                id(color_scheme_select).publish_state(name);

            # some things to refresh from persisted settings
            - lvgl.widget.refresh: battery_symbol_obj

            - if:
                condition:
                  lambda: return id(settings_hide_soc_persistent);
                then:
                  - switch.turn_on: hide_soc_switch
                else:
                  - switch.turn_off: hide_soc_switch
            - lambda: id(min_soc_value_number).publish_state(static_cast<float>(id(settings_min_soc_value_persistent)));
            - lambda: id(min_gas_value_number).publish_state(static_cast<float>(id(settings_min_gas_value_persistent)));
            - globals.set:
                id: boot_screen_hidden
                value: 'true'

  - id: apply_color_scheme
    mode: restart
    then:
      - lambda: |-
          int target_idx = id(settings_color_scheme_idx_persistent);   // current selected index (0,1,2,3)
          const std::vector<uint32_t>* selected_vec = nullptr;
          std::string selected_name = "unknown";

          // First: find the matching scheme by index (vec[0])
          for (const auto& pair : id(color_schemes)) {
            const auto& vec = pair.second;
            if (vec.empty()) continue;

            int scheme_idx = static_cast<int>(vec[0]);   // your 0,1,2,3
            if (scheme_idx == target_idx) {
              selected_vec = &vec;         // remember the correct vector
              selected_name = pair.first;  // remember the name for logging
              break;                       // found it → exit loop early
            }
          }

          // If nothing found (corrupted data?), fall back to first scheme (index 0)
          if (!selected_vec) {
            ESP_LOGW("color_scheme", "Invalid index %d → falling back to default (white)", target_idx);
            for (const auto& pair : id(color_schemes)) {
              const auto& vec = pair.second;
              if (vec.empty()) continue;
              if (static_cast<int>(vec[0]) == 0) {
                selected_vec = &vec;
                selected_name = pair.first;
                id(settings_color_scheme_idx_persistent) = 0;
                break;
              }
            }
          }

          if (selected_vec && selected_vec->size() >= 8) {
            id(color_100)   = (*selected_vec)[1];
            id(color_75)    = (*selected_vec)[2];
            id(color_50)    = (*selected_vec)[3];
            id(color_25)    = (*selected_vec)[4];
            id(color_00)    = (*selected_vec)[5];
            id(color_good)  = (*selected_vec)[6];
            id(color_bad)   = (*selected_vec)[7];
            id(color_light) = (*selected_vec)[8];

            if (${FORCE_SHADOW_COLOR_TO_BLACK}) {
              id(color_00) = 0x000000;
            }

            // THIS SCHOULD BE THE MAGIC LINE: tells every LVGL object that styles changed
            // BUT: DOES NOT WORK at the moment
            lv_obj_report_style_change(NULL);

            ESP_LOGI("color_scheme", "Applied scheme '%s' (index %d)", selected_name.c_str(), target_idx);
          } else {
            ESP_LOGE("color_scheme", "Failed to apply color scheme – data invalid");
          }
      - lambda: |-
          lv_obj_set_style_arc_color(boot_spinner, lv_color_hex(id(color_100)), LV_PART_INDICATOR);

      # Chunk 1: Status bar widgets
      - lvgl.widget.refresh:
          - battery_symbol
          - wifi_connect_label
          - warning_on_label
      - delay: 1ms

      # Chunk 2: Gas widgets
      - lvgl.widget.refresh:
          - gas_level_obj
          - gas_percent_bar
          - gas_warning_mark
          - weight_label_background
          - weight_label
          - weight_unit
          - weight_rate_icon
          - weight_rate_background
          - weight_rate_value
          - weight_rate_unit
          - weight_time_background
          - weight_time_value
          - weight_time_unit
          - weight_time_icon
          - calibration_button
          - calibration_button_label
          - calibration_button_cog_label
          - calibration0_label
          - calibration0_next_button
          - calibration0_next_button_label
          - calibration1_label
          - calibration1_next_button
          - calibration1_next_button_label
          - calibration2_label
          - calibration2_tare_label
          - calibration2_slider
          - calibration2_inc_button
          - calibration2_inc_button_label
          - calibration2_dec_button
          - calibration2_dec_button_label
          - calibration2_ok_button
          - calibration2_ok_button_label
          - calibration3_label
          - calibration3_abort_button
          - calibration3_abort_button_label
          - calibration3_ok_button
          - calibration3_ok_button_label
          - calibration4_label
          - calibration4_understood_button
          - calibration4_understood_button_label
          - calibration_bottle_kg_button_0
          - calibration_bottle_kg_button_0_label
          - calibration_bottle_kg_button_1
          - calibration_bottle_kg_button_1_label
          - calibration_bottle_kg_button_2
          - calibration_bottle_kg_button_2_label
      - delay: 1ms

      # Chunk: Settings page
      - lvgl.widget.refresh:
          - current_wifi_ip_label1
          - current_wifi_ip_label
          - current_version_label1
          - current_version_label2
          - uart_raw_value1
          - uart_raw_value
          - soc_warning_label1
          - soc_warning_label2
          - gas_warning_label1
          - gas_warning_label2
          - color_100_label
          - color_75_label
          - color_50_label
          - color_25_label
          - color_00_label
          - color_good_label
          - color_bad_label
          - color_light_label
      - delay: 1ms

      # Nested slider parts do not pick up a scheme change from widget refresh.
      - lambda: |-
          lv_obj_set_style_bg_color(calibration2_slider, lv_color_hex(id(color_50)), LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(calibration2_slider, lv_color_hex(id(color_100)), LV_PART_KNOB);
          lv_obj_set_style_text_color(calibration2_label, lv_color_hex(id(color_100)), LV_PART_MAIN);
          lv_obj_set_style_text_color(calibration2_tare_label, lv_color_hex(id(color_100)), LV_PART_MAIN);
      - script.execute: style_bottle_kg_buttons

  - id: style_bottle_kg_buttons
    then:
      # checked: styles are applied once at startup, before the scheme exists,
      # and widget refresh does not update them.
      - lambda: |-
          lv_obj_t *buttons[] = {
            calibration_bottle_kg_button_0,
            calibration_bottle_kg_button_1,
            calibration_bottle_kg_button_2,
          };
          const lv_color_t fill = lv_color_hex(id(color_50));
          const lv_style_selector_t states[] = {
            static_cast<lv_style_selector_t>(LV_PART_MAIN | LV_STATE_CHECKED),
            static_cast<lv_style_selector_t>(LV_PART_MAIN | LV_STATE_PRESSED),
            static_cast<lv_style_selector_t>(LV_PART_MAIN | LV_STATE_CHECKED | LV_STATE_PRESSED),
          };
          for (lv_obj_t *button : buttons) {
            for (lv_style_selector_t state : states) {
              lv_obj_set_style_bg_color(button, fill, state);
              lv_obj_set_style_bg_opa(button, LV_OPA_COVER, state);
              lv_obj_set_style_border_color(button, fill, state);
              lv_obj_set_style_border_width(button, 1, state);
              lv_obj_set_style_border_opa(button, LV_OPA_COVER, state);
            }
          }
          lv_obj_set_style_bg_opa(calibration_bottle_kg_button_0_label, LV_OPA_TRANSP, LV_PART_MAIN);
          lv_obj_set_style_bg_opa(calibration_bottle_kg_button_1_label, LV_OPA_TRANSP, LV_PART_MAIN);
          lv_obj_set_style_bg_opa(calibration_bottle_kg_button_2_label, LV_OPA_TRANSP, LV_PART_MAIN);

  - id: show_scale_bottle_kg_selection
    then:
      - lvgl.widget.update:
          id: calibration_bottle_kg_button_0
          state:
            checked: !lambda return id(settings_scale_bottle_kg) == id(scale_bottle_kg_options)[0];
      - lvgl.widget.update:
          id: calibration_bottle_kg_button_1
          state:
            checked: !lambda return id(settings_scale_bottle_kg) == id(scale_bottle_kg_options)[1];
      - lvgl.widget.update:
          id: calibration_bottle_kg_button_2
          state:
            checked: !lambda return id(settings_scale_bottle_kg) == id(scale_bottle_kg_options)[2];
      - lvgl.widget.refresh:
          - calibration_bottle_kg_button_0
          - calibration_bottle_kg_button_0_label
          - calibration_bottle_kg_button_1
          - calibration_bottle_kg_button_1_label
          - calibration_bottle_kg_button_2
          - calibration_bottle_kg_button_2_label
      - script.execute: style_bottle_kg_buttons

  - id: toggle_settings_page
    then:
      - if:
          condition:
            or:
              - lambda: 'return lv_scr_act() == id(scale_page)->obj;'
          then:
            - lvgl.page.show: settings_page
          else:
            - lvgl.page.show: scale_page
